name: Quality Lens Analysis

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install project dependencies
        run: bun install

      - name: Setup Node.js (for quality-lens CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Quality Lens CLI
        run: npm install -g @principal-ai/quality-lens-cli

      - name: Run quality lenses
        run: quality-lens run . --output results.json --format json

      - name: Display results summary
        if: always()
        run: quality-lens summary results.json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-lens-results-${{ github.sha }}
          path: results.json
          if-no-files-found: warn
